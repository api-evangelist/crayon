  registration: dynamic (RFC 7591) at https://app.crayon.co/oauth/register/
  scopes: [mcp:read]
  detail: authentication/crayon-authentication.yml

transport:
  protocol: MCP over Streamable HTTP (JSON-RPC 2.0 over POST)
  endpoint: https://mcp.crayon.co/mcp/
  trailing_slash_required: true
  trailing_slash_note: >-
    POST to https://mcp.crayon.co/mcp (no trailing slash) returns HTTP 307 with
    Location: https://mcp.crayon.co/mcp/. A client that does not preserve the method and body
    across a 307 will silently fail; this is a real integration trap and is recorded as observed.
  accept: application/json, text/event-stream
  server_header: openresty/1.29.2.5

error_envelope:
  format: flat OAuth-style JSON object
  content_type: application/json
  fields: [error, error_description]
  problem_json: false
  note: >-
    Not RFC 9457. The 401 body is {"error":"invalid_token","error_description":"..."} and the
    same information is repeated in the WWW-Authenticate header along with a resource_metadata
    parameter pointing at the RFC 9728 document.
  detail: conformance/crayon-conformance.yml

