aid: crayon
name: Crayon
description: >-
  Crayon is a Boston-based competitive intelligence platform that automatically captures,
  analyzes and distributes competitor activity — website and pricing changes, product updates,
  social posts, news, reviews, job postings and review-site sentiment — and turns it into
  battlecards, competitor profiles, win/loss stories, objection handling and email digests for
  product marketing, sales enablement and go-to-market teams. Crayon AI adds automated
  summarization, dynamic battlecard updates and the 2026 'Sparks' feature, which reads a
  competitor's strategic moves and writes them up for revenue teams. On 2026-09-04 Crayon shipped
  what it describes as the first competitive-intelligence MCP server, a hosted OAuth-protected
  Model Context Protocol endpoint that exposes a customer's own curated Crayon content to Claude,
  ChatGPT, Glean, Microsoft Copilot, Google Gemini and internal Slack or Teams assistants. Crayon
  also markets a Content API and an Answers API, but publishes no developer portal, reference or
  machine-readable specification for either. NOTE: Crayon (crayon.co) is unrelated to Crayon
  Group ASA (crayon.com), the Norwegian Microsoft CSP.
