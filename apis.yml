      https://app.crayon.co/ as the authorization server — proving the endpoint is operated by
      Crayon (crayon.co).
- aid: crayon:content-answers-api
  name: Crayon Content and Answers API
  description: >-
    Crayon markets a Content API (battlecards, win/loss stories, competitor profiles, objection
    handling, customer proof points) and an Answers API (structured real-time answers) for pulling
    curated competitive content into CRMs, enterprise search, Slackbots and custom AI assistants.
    Both are announced in Crayon's own blog posts, but NO endpoint, base URL, authentication
    model, reference or machine-readable specification is published for either — access runs
    through a sales conversation. No baseURL is recorded because Crayon publishes none; it is
    deliberately absent rather than guessed from the domain.
  humanURL: https://www.crayon.co/blog/connecting-competitive-intel-to-enterprise-ai-with-api-mcp
