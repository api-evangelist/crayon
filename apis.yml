aid: crayon
name: Crayon
description: >-
  Crayon is a competitive intelligence platform that automates the
  gathering, analysis, and distribution of competitor data from websites,
  social media, news, reviews, and other digital sources to power
  battlecards, win/loss analysis, and sales enablement. Its 2026 'Sparks'
  AI feature analyzes competitors' strategic moves and generates summaries
  for go-to-market teams. Crayon offers Content and Answers APIs plus a
  Competitive Intelligence MCP Server for integrating competitor insights
  into platforms like ChatGPT, Glean, Copilot, Slack, and CRMs.
type: Index
