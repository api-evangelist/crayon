apis:
- aid: crayon:mcp-server
  name: Crayon Competitive Intelligence MCP Server
  description: >-
    Hosted Model Context Protocol server exposing a customer's curated Crayon competitive
    intelligence — battlecards, win/loss stories, competitor profiles, objection handling and
    customer proof points — to MCP-capable assistants such as Claude, ChatGPT, Glean, Microsoft
    Copilot, Google Gemini and internal Slack or Teams bots. JSON-RPC over Streamable HTTP,
    protected by OAuth 2.1 with dynamic client registration and the single scope mcp:read.
    Verified live: an anonymous tools/list POST returns HTTP 401 with an RFC 9728
    resource_metadata challenge, so the tool set is auth-gated.
  humanURL: https://www.crayon.co/blog/crayon-launches-first-competitive-intelligence-mcp-server
  baseURL: https://mcp.crayon.co/mcp/
  tags:
  - MCP
  - Competitive Intelligence
  - Artificial Intelligence
  tags_raw:
  - MCP
  - Competitive Intelligence
  - AI
