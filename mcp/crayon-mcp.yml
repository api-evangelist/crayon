description: >-
  Crayon's hosted Model Context Protocol server, announced 2026-09-04 as the first
  competitive-intelligence MCP server. It exposes the competitive content a customer already
  manages in Crayon — battlecards, win/loss stories, competitor profiles, objection handling
  and customer proof points — to MCP-capable assistants (Claude, ChatGPT, Glean, Microsoft
  Copilot, Google Gemini, Slack/Teams bots and custom assistants).

