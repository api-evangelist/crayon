tools: []
tools_note: >-
  tools/list is auth-gated. An anonymous JSON-RPC POST of
  {"jsonrpc":"2.0","id":1,"method":"tools/list"} to https://mcp.crayon.co/mcp/ returns HTTP 401
  with WWW-Authenticate: Bearer error="invalid_token" and a resource_metadata pointer, so the
  live tool set and its inputSchemas require an authenticated Crayon tenant. Crayon publishes no
  tool list, llms.txt or public reference, so NO tool names are recorded here rather than guessed.
  The vendor's own announcement names two API surfaces the server fronts — a Content API
  (battlecards, win/loss stories, competitor profiles, objection handling, customer proof points)
  and an Answers API (structured real-time answers) — but names no tools, operations or endpoints.

