openapi: 3.1.0
info:
  title: Crayon Agreements Billing API
  description: 'Crayon''s REST API for managing CSP organizations, users, customer tenants,

    Microsoft subscriptions, Azure plans, agreements, invoices and billing

    statements. Endpoint inventory drawn from the public scenarios catalog at

    https://apidocs.crayon.com.

    '
  version: '1.0'
  contact:
    name: Crayon API Support
    url: https://apidocs.crayon.com
servers:
- url: https://api.crayon.com/api/v1
  description: Production
security:
- BearerAuth: []
tags:
- name: Billing
paths:
  /invoices:
    get:
      summary: List invoices
      operationId: getInvoices
      tags:
      - Billing
      responses:
        '200':
          description: Invoices
  /billingStatements:
    get:
      summary: List billing statements
      operationId: getBillingStatements
      tags:
      - Billing
      responses:
        '200':
          description: Billing statements
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.crayon.com/api/v1/connect/token
          scopes: {}
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
